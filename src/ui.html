<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }

      :root {
        --ui-bg-main: #ffffff;
        --ui-bg-secondary: #eceef1;
        --ui-bg-tertiary: #f9f9f9;
        --ui-border-primary: #d9dde2;
        --ui-text-primary: #55606b;
        --ui-text-placeholder: rgba(85, 96, 107, 0.4);
        --text-link-blue: #0072e9;
      }

      body {
        margin: 0;
        background: var(--ui-bg-main);
        color: var(--ui-text-primary);
        font-family: "IRANSansXVF", "IRANSans", Tahoma, Arial, sans-serif;
        direction: rtl;
        text-align: right;
        overflow: hidden;
      }

      button,
      input,
      textarea {
        font-family: inherit;
      }

      button {
        border: 0;
        cursor: pointer;
      }

      .panel {
        display: none;
      }

      .panel.active {
        display: flex;
      }

      .editor {
        width: 450px;
        min-height: 374px;
        flex-direction: column;
        align-items: stretch;
        background: var(--ui-bg-main);
        direction: rtl;
        position: relative;
        overflow: hidden;
      }

      .editor-toolbar {
        display: flex;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        min-height: 52px;
        padding: 8px 12px;
        border-bottom: 0.5px solid var(--ui-border-primary);
        overflow: hidden;
        direction: rtl;
      }

      .editor-tools {
        display: flex;
        flex: 1 0 0;
        min-width: 0;
        align-items: center;
        justify-content: flex-start;
        gap: 4px;
        direction: rtl;
        flex-direction: row;
      }

      .pill {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        flex: 0 0 auto;
        border-radius: 999px;
        padding: 2px 8px;
        font-size: 12px;
        font-weight: 500;
        line-height: normal;
        white-space: nowrap;
      }

      .author-pill {
        background: var(--ui-bg-secondary);
        color: var(--ui-text-primary);
        padding-left: 8px;
        padding-right: 4px;
        padding-top: 4px;
        padding-bottom: 4px;
        flex-direction: row;
        font-size: 13px;
        font-weight: 600;
      }

      .status-pill {
        background: var(--category-bg);
        color: var(--category-status);
        padding: 4px 12px;
        font-size: 13px;
        font-weight: 600;
      }

      #categoryButton {
        padding: 0;
        background: transparent;
      }

      #authorButton {
        padding: 0;
        background: transparent;
      }

      .status-choice {
        padding: 0;
        border-radius: 999px;
        background: transparent;
      }

      .author-choice {
        padding: 0;
        border-radius: 999px;
        background: transparent;
      }

      .choice-panel {
        width: 216px;
        min-height: 0;
        flex-direction: column;
        align-items: stretch;
        padding-bottom: 24px;
        background: var(--ui-bg-main);
        direction: rtl;
        overflow: hidden;
      }

      .choice-list {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        width: 100%;
      }

      .choice-row {
        display: flex;
        flex-direction: row;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
        width: 100%;
        padding: 8px 12px;
        border-bottom: 0.5px solid var(--ui-border-primary);
        background: var(--ui-bg-main);
        color: var(--ui-text-primary);
        font-size: 14px;
        font-weight: 500;
        line-height: normal;
        direction: rtl;
        text-align: right;
      }

      .choice-row:last-child {
        border-bottom: 0;
      }

      .choice-row:hover {
        background: var(--ui-bg-tertiary);
      }

      .choice-label {
        color: var(--ui-text-primary);
        font-size: 14px;
        font-weight: 500;
        line-height: normal;
        white-space: nowrap;
      }

      .category-dot {
        width: 10px;
        height: 10px;
        flex: 0 0 auto;
        border-radius: 999px;
      }

      .avatar {
        width: 20px;
        height: 20px;
        border-radius: 999px;
        object-fit: cover;
        overflow: hidden;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #111827;
        font-size: 8px;
        font-weight: 700;
      }

      .icon-action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 36px;
        height: 36px;
        padding: 4px;
        border-radius: 999px;
        background: transparent;
        color: var(--ui-text-primary);
      }

      .icon-action:hover,
      .icon-action.active,
      .icon-action.active:hover {
        background: rgba(85, 96, 107, 0.1);
      }

      .icon-action svg {
        width: 28px;
        height: 28px;
        display: block;
      }

      .picker-strip {
        display: none;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-start;
        gap: 8px;
        width: 100%;
        padding: 8px 12px;
        background: var(--ui-bg-tertiary);
        border-bottom: 0.5px solid var(--ui-border-primary);
        direction: rtl;
      }

      .picker-strip.active {
        display: flex;
      }

      .field {
        width: 100%;
        border: 0;
        border-bottom: 0.5px solid var(--ui-border-primary);
        background: var(--ui-bg-main);
        color: var(--ui-text-primary);
        outline: none;
        text-align: right;
      }

      .title-field {
        padding: 16px 12px;
        font-size: 20px;
        font-weight: 600;
        line-height: normal;
      }

      .body-field {
        height: 240px;
        resize: none;
        padding: 16px 12px;
        font-size: 16px;
        font-weight: 400;
        line-height: normal;
      }

      .field::placeholder {
        color: var(--ui-text-placeholder);
        opacity: 1;
      }

      .links-panel {
        display: none;
        flex-direction: column;
        align-items: flex-end;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 8px 12px;
        background: var(--ui-bg-tertiary);
        border-bottom: 0.5px solid var(--ui-border-primary);
      }

      .links-panel.active {
        display: flex;
      }

      .links-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        direction: rtl;
        font-size: 12px;
        font-weight: 500;
        line-height: normal;
      }

      .new-link {
        padding: 0 0 4px;
        background: transparent;
        color: var(--text-link-blue);
        font-size: 12px;
        font-weight: 600;
      }

      .links-title {
        color: var(--ui-text-primary);
      }

      .link-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 100%;
      }

      .link-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        direction: rtl;
      }

      .link-content {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 240px;
        min-width: 0;
        direction: ltr;
      }

      .link-actions {
        display: flex;
        align-items: center;
        gap: 0;
        flex: 0 0 auto;
        direction: ltr;
      }

      .link-action-edit {
        margin-left: 8px;
      }

      .link-url-text {
        min-width: 0;
        max-width: 250px;
        margin-left: 12px;
        overflow: hidden;
        color: var(--ui-text-primary);
        font-size: 16px;
        font-weight: 400;
        opacity: 0.8;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .link-title-display {
        display: flex;
        align-items: center;
        gap: 4px;
        flex: 0 0 auto;
        color: var(--ui-text-primary);
        direction: rtl;
        font-size: 16px;
        font-weight: 400;
        white-space: nowrap;
      }

      .link-title-display svg {
        width: 20px;
        height: 20px;
        color: var(--ui-text-primary);
        opacity: 0.8;
      }

      .trash-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        padding: 0;
        background: transparent;
        color: var(--ui-text-primary);
        opacity: 0.8;
      }

      .trash-button svg {
        width: 20px;
        height: 20px;
      }

      .footer {
        display: flex;
        flex-direction: row-reverse;
        align-items: center;
        justify-content: flex-start;
        width: 100%;
        padding: 12px 12px;
        border-bottom: 0.5px solid var(--ui-border-primary);
      }

      .save {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 16px;
        border-radius: 999px;
        background: var(--text-link-blue);
        color: var(--ui-bg-main);
        font-size: 12px;
        font-weight: 400;
      }

      .link-modal-layer {
        display: none;
        position: absolute;
        inset: 0;
        z-index: 10;
        align-items: center;
        justify-content: center;
        background: rgba(85, 96, 107, 0.4);
      }

      .link-modal-layer.active {
        display: flex;
      }

      .link-dialog {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 16px;
        width: calc(100% - 32px);
        padding: 16px;
        border: 1px solid var(--ui-border-primary);
        border-radius: 8px;
        background: var(--ui-bg-main);
      }

      .link-dialog-title {
        margin: 0;
        color: var(--ui-text-primary);
        font-size: 14px;
        font-weight: 600;
      }

      .link-dialog-fields {
        display: flex;
        flex-direction: column;
        gap: 8px;
        width: 100%;
      }

      .link-dialog-input {
        width: 100%;
        border: 1px solid var(--ui-border-primary);
        border-radius: 6px;
        background: var(--ui-bg-main);
        color: var(--ui-text-primary);
        font-size: 12px;
        font-weight: 500;
        outline: none;
        padding: 8px 6px;
        text-align: right;
      }

      .link-dialog-input.url-filled {
        color: var(--text-link-blue);
      }

      .link-dialog-input::placeholder {
        color: var(--ui-text-placeholder);
        opacity: 1;
      }

      .link-dialog-actions {
        display: flex;
        justify-content: flex-start;
        gap: 4px;
        width: 100%;
        direction: ltr;
      }

      .dialog-primary,
      .dialog-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 8px 16px;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 500;
      }

      .dialog-primary {
        background: var(--text-link-blue);
        color: var(--ui-bg-main);
      }

      .dialog-secondary {
        border: 1px solid var(--ui-border-primary);
        background: var(--ui-bg-main);
        color: var(--ui-text-primary);
      }

      .all-notes-panel {
        width: 450px;
        height: 580px;
        flex-direction: column;
        align-items: stretch;
        background: var(--ui-bg-main);
        color: var(--ui-text-primary);
        direction: rtl;
        overflow: hidden;
      }

      .all-notes-searchbar {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 36px;
        margin: 0;
        padding: 8px 6px;
        border: 1px solid var(--ui-border-primary);
        border-radius: 6px;
        background: var(--ui-bg-main);
        direction: rtl;
      }

      .all-notes-search {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ui-text-primary);
        font-size: 12px;
        font-weight: 500;
        text-align: right;
      }

      .all-notes-search::placeholder {
        color: var(--ui-text-placeholder);
        opacity: 1;
      }

      .all-notes-tabs {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-start;
        gap: 4px;
        width: 100%;
        direction: rtl;
        text-align: right;
      }

      .all-notes-tab {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 4px 12px;
        border: 1px solid var(--ui-border-primary);
        border-radius: 999px;
        background: var(--ui-bg-main);
        color: var(--ui-text-primary);
        font-size: 13px;
        font-weight: 600;
        line-height: normal;
      }

      .all-notes-tab.selected {
        border-color: transparent;
        background: #d5ecf8;
        color: var(--text-link-blue);
      }

      .all-notes-list {
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: stretch;
        width: 100%;
        padding: 0;
        overflow: auto;
      }

      .all-note-row {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        align-items: center;
        justify-content: stretch;
        gap: 10px;
        width: 100%;
        padding: 8px;
        border-radius: 6px;
        background: transparent;
        color: var(--ui-text-primary);
        direction: ltr;
        text-align: right;
      }

      .all-note-row:hover {
        background: var(--ui-bg-tertiary);
      }

      .all-note-content {
        display: flex;
        align-items: flex-start;
        grid-column: 2;
        justify-content: flex-end;
        min-width: 0;
        text-align: right;
      }

      .all-note-text {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        min-width: 0;
        width: 100%;
      }

      .all-note-title {
        overflow: hidden;
        color: var(--ui-text-primary);
        font-size: 14px;
        font-weight: 600;
        line-height: normal;
        text-align: right;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .all-note-meta {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 6px;
        min-width: 0;
        overflow: hidden;
        color: var(--ui-text-primary);
        font-size: 12px;
        font-weight: 500;
        line-height: normal;
        opacity: 0.6;
        text-align: right;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .all-note-meta-dot {
        width: 3px;
        height: 3px;
        border-radius: 999px;
        background: currentColor;
        flex: 0 0 auto;
      }

      .all-note-chip {
        display: inline-flex;
        align-items: center;
        grid-column: 1;
        grid-row: 1;
        justify-self: start;
        padding: 4px 12px;
        border-radius: 999px;
        font-size: 13px;
        font-weight: 600;
        line-height: normal;
      }

      .all-notes-empty {
        padding: 32px 14px;
        color: var(--ui-text-placeholder);
        font-size: 12px;
        text-align: center;
      }

      .all-notes-search-section {
        width: 100%;
        padding: 12px 16px;
        border-bottom: 0.5px solid var(--ui-border-primary);
      }

      .all-notes-content-section {
        display: flex;
        flex: 1;
        flex-direction: column;
        align-items: flex-end;
        gap: 12px;
        width: 100%;
        padding: 12px 16px;
        border-bottom: 0.5px solid var(--ui-border-primary);
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <form id="fullEditForm" class="panel editor">
      <div class="editor-toolbar" data-close-picker>
        <div class="editor-tools">
          <button type="button" class="icon-action" data-full-format="bullet" aria-label="لیست"></button>
          <button type="button" class="icon-action" data-full-format="number" aria-label="لیست عددی"></button>
          <button type="button" class="icon-action" id="linkToggleButton" aria-label="لینک"></button>
          <button type="button" class="pill status-pill" id="categoryButton"></button>
          <button type="button" class="pill author-pill" id="authorButton"></button>
        </div>
      </div>

      <div id="categoryPicker" class="picker-strip"></div>
      <div id="authorPicker" class="picker-strip"></div>

      <input id="fullEditTitle" class="field title-field" type="text" placeholder="یادداشت جدید" dir="rtl" />
      <textarea id="fullEditBody" class="field body-field" placeholder="یادداشت ..."></textarea>

      <section id="linksPanel" class="links-panel">
        <div class="links-header">
          <span class="links-title" id="linksTitle">لینک‌ها (۰)</span>
          <button type="button" class="new-link" id="addFullEditLink">لینک جدید</button>
        </div>
        <div id="fullEditLinks" class="link-list"></div>
      </section>

      <div id="linkModalLayer" class="link-modal-layer">
        <div class="link-dialog">
          <p class="link-dialog-title" id="linkDialogTitle">افزودن لینک</p>
          <div class="link-dialog-fields">
            <input id="linkDialogTitleInput" class="link-dialog-input" type="text" placeholder="عنوان لینک" dir="rtl" />
            <input id="linkDialogUrlInput" class="link-dialog-input" type="text" placeholder="نشانی لینک" dir="rtl" />
          </div>
          <div class="link-dialog-actions">
            <button type="button" class="dialog-primary" id="linkDialogSave">افزودن لینک</button>
            <button type="button" class="dialog-secondary" id="linkDialogCancel">انصراف</button>
          </div>
        </div>
      </div>
    </form>

    <form id="linkForm" class="panel editor">
      <section class="links-panel active">
        <div class="links-header">
          <span class="links-title" id="manageLinksTitle">لینک‌ها (۰)</span>
          <button type="button" class="new-link" id="addManageLink">لینک جدید</button>
        </div>
        <div id="manageLinks" class="link-list"></div>
      </section>
      <div class="footer">
        <button type="submit" class="save">ذخیره لینک‌ها</button>
      </div>
    </form>

    <section id="categoryPanel" class="panel choice-panel">
      <div id="categoryList" class="choice-list"></div>
    </section>

    <section id="authorPanel" class="panel choice-panel">
      <div id="authorList" class="choice-list"></div>
    </section>

    <section id="allNotesPanel" class="panel all-notes-panel">
      <div class="all-notes-search-section">
        <div class="all-notes-searchbar">
          <input id="allNotesSearch" class="all-notes-search" type="text" placeholder="جستجوی یادداشت" />
        </div>
      </div>
      <div class="all-notes-content-section">
        <div class="all-notes-tabs" id="allNotesFilters"></div>
        <div id="allNotesList" class="all-notes-list"></div>
      </div>
    </section>

      const CATEGORY_THEMES = {
        business: { bg: "#EFE4FA", status: "#815AAD" },
        design: { bg: "#D5ECF8", status: "#3286B4" },
        design_changes: { bg: "#D5F0E3", status: "#00915C" },
        technical: { bg: "#FFEACD", status: "#D77925" },
        feedback: { bg: "#FFDEDD", status: "#C73D43" }
      };
      const CATEGORY_PICKER_ORDER = ["business", "design", "design_changes", "technical", "feedback"];

      const linkForm = document.getElementById("linkForm");
      const categoryPanel = document.getElementById("categoryPanel");
      const authorPanel = document.getElementById("authorPanel");
      const fullEditForm = document.getElementById("fullEditForm");
      const categoryList = document.getElementById("categoryList");
      const authorList = document.getElementById("authorList");
      const categoryPicker = document.getElementById("categoryPicker");
      const authorPicker = document.getElementById("authorPicker");
      const authorButton = document.getElementById("authorButton");
      const categoryButton = document.getElementById("categoryButton");
      const linkToggleButton = document.getElementById("linkToggleButton");
      const manageLinks = document.getElementById("manageLinks");
      const manageLinksTitle = document.getElementById("manageLinksTitle");
      const addManageLink = document.getElementById("addManageLink");
      const fullEditTitle = document.getElementById("fullEditTitle");
      const fullEditBody = document.getElementById("fullEditBody");
      const fullEditLinks = document.getElementById("fullEditLinks");
      const linksPanel = document.getElementById("linksPanel");
      const linksTitle = document.getElementById("linksTitle");
      const addFullEditLink = document.getElementById("addFullEditLink");
      const linkModalLayer = document.getElementById("linkModalLayer");
      const linkDialogTitle = document.getElementById("linkDialogTitle");
      const linkDialogTitleInput = document.getElementById("linkDialogTitleInput");
      const linkDialogUrlInput = document.getElementById("linkDialogUrlInput");
      const linkDialogSave = document.getElementById("linkDialogSave");
      const linkDialogCancel = document.getElementById("linkDialogCancel");
      const allNotesPanel = document.getElementById("allNotesPanel");
      const allNotesList = document.getElementById("allNotesList");
      const allNotesSearch = document.getElementById("allNotesSearch");
      const allNotesFilters = document.getElementById("allNotesFilters");

      let manageLinkState = [];
      let fullEditLinkState = [];
      let allNotesState = [];
      let allNotesFilter = "all";
      let currentMode = "fullEdit";
      let categoriesState = [];
      let authorsState = [];
      let selectedCategory = "technical";
      let selectedAuthorId = "";
      let activePicker = null;
      let editingLinkIndex = null;
      let activeListFormat = null;

      document.getElementById("linkToggleButton").innerHTML = ICONS.link;
      const numberListButton = document.querySelector('[data-full-format="number"]');
      const bulletListButton = document.querySelector('[data-full-format="bullet"]');
      numberListButton.innerHTML = ICONS.listOl;
      bulletListButton.innerHTML = ICONS.list;

      function show(mode) {
        currentMode = mode;
        linkForm.classList.toggle("active", mode === "link");
        categoryPanel.classList.toggle("active", mode === "category");
        authorPanel.classList.toggle("active", mode === "author");
        fullEditForm.classList.toggle("active", mode === "fullEdit");
        allNotesPanel.classList.toggle("active", mode === "allNotes");
        requestModalResize();
      }

      function requestModalResize() {
        requestAnimationFrame(() => {
          const activePanel = document.querySelector(".panel.active");
          if (!activePanel) return;
          const rect = activePanel.getBoundingClientRect();
          const minHeight = activePanel.classList.contains("choice-panel") || activePanel.classList.contains("all-notes-panel") ? 0 : 374;
          parent.postMessage({
            pluginMessage: {
              type: "resize",
              payload: {
                width: Math.max(216, Math.ceil(rect.width)),
                height: Math.max(minHeight, Math.ceil(rect.height))
              }
            }
          }, "*");
        });
      }

      function toPersianNumber(value) {
        return String(value).replace(/\d/g, (digit) => "۰۱۲۳۴۵۶۷۸۹"[Number(digit)]);
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function categoryTheme(key) {
        return CATEGORY_THEMES[key] || CATEGORY_THEMES.technical;
      }

      function findCategory(key) {
        return categoriesState.find((category) => category.key === key) || categoriesState[0] || { key: "technical", label: "فنی" };
      }

      function findAuthor(id) {
        return authorsState.find((author) => author.id === id) || authorsState[0] || { id: "", name: "Zahra", initials: "ZA" };
      }

      function avatarNode(author) {
        if (author.avatarSrc) return `<img class="avatar" src="${author.avatarSrc}" alt="" />`;
        return `<span class="avatar" style="background:${author.avatarFill || "#e5e7eb"}">${author.initials || ""}</span>`;
      }

      function authorNode(author) {
        return `<span class="pill author-pill">${avatarNode(author)}<span>${author.name}</span></span>`;
      }

      function statusNode(category) {
        const theme = categoryTheme(category.key);
        return `<span class="pill status-pill" style="--category-bg:${theme.bg};--category-status:${theme.status};">${category.label}</span>`;
      }

      function renderToolbar() {
        const category = findCategory(selectedCategory);
        const theme = categoryTheme(category.key);
        const author = findAuthor(selectedAuthorId);
        document.documentElement.style.setProperty("--category-bg", theme.bg);
        document.documentElement.style.setProperty("--category-status", theme.status);
        authorButton.innerHTML = authorNode(author);
        categoryButton.innerHTML = statusNode(category);
      }

      function closePickers() {
        activePicker = null;
        categoryPicker.classList.remove("active");
        authorPicker.classList.remove("active");
        categoryButton.classList.remove("active");
        authorButton.classList.remove("active");
        requestModalResize();
      }

      function togglePicker(type) {
        if (activePicker === type) {
          closePickers();
          return;
        }
        activePicker = type;
        categoryPicker.classList.toggle("active", type === "category");
        authorPicker.classList.toggle("active", type === "author");
        categoryButton.classList.toggle("active", type === "category");
        authorButton.classList.toggle("active", type === "author");
        requestModalResize();
      }

      function renderCategoryChoices(target, selected, closeAfterSelect) {
        target.innerHTML = "";
        [...categoriesState]
          .sort((a, b) => CATEGORY_PICKER_ORDER.indexOf(a.key) - CATEGORY_PICKER_ORDER.indexOf(b.key))
          .forEach((category) => {
          const theme = categoryTheme(category.key);
          const button = document.createElement("button");
          button.type = "button";
          if (closeAfterSelect) {
            button.className = "status-choice";
            button.innerHTML = statusNode(category);
          } else {
            button.className = "choice-row";
            button.innerHTML = `<span class="category-dot" style="background:${theme.status};"></span><span class="choice-label">${category.label}</span>`;
          }
          button.addEventListener("click", () => {
            selectedCategory = category.key;
            renderToolbar();
            if (closeAfterSelect) {
              closePickers();
              emitLiveUpdate();
            }
            else parent.postMessage({ pluginMessage: { type: "saveCategory", payload: { category: category.key } } }, "*");
          });
          target.appendChild(button);
        });
      }

      function renderAuthorChoices(target, selected, closeAfterSelect) {
        target.innerHTML = "";
        authorsState.forEach((author) => {
          const button = document.createElement("button");
          button.type = "button";
          if (closeAfterSelect) {
            button.className = "author-choice";
            button.innerHTML = authorNode(author);
          } else {
            button.className = "choice-row";
            button.innerHTML = `${avatarNode(author)}<span class="choice-label">${author.name}</span>`;
          }
          button.addEventListener("click", () => {
            selectedAuthorId = author.id;
            renderToolbar();
            if (closeAfterSelect) {
              closePickers();
              emitLiveUpdate();
            }
            else parent.postMessage({ pluginMessage: { type: "saveAuthor", payload: { authorId: author.id } } }, "*");
          });
          target.appendChild(button);
        });
      }

      function normalizeLinkState(links) {
        return (links || []).map((link, index) => ({
          id: link.id || `new-${Date.now()}-${index}`,
          title: link.title || "",
          url: link.url || ""
        }));
      }

      function renderLinkRows(container, links, titleNode, onChange) {
        container.innerHTML = "";
        titleNode.textContent = `لینک‌ها (${toPersianNumber(links.length)})`;
        links.forEach((link, index) => {
          const row = document.createElement("div");
          row.className = "link-row";
          row.dataset.linkId = link.id;

          const content = document.createElement("div");
          content.className = "link-content";

          const actions = document.createElement("div");
          actions.className = "link-actions";

          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "trash-button";
          remove.innerHTML = ICONS.trash;
          remove.addEventListener("click", () => {
            links.splice(index, 1);
            onChange(links);
            emitLiveUpdate();
          });

          const edit = document.createElement("button");
          edit.type = "button";
          edit.className = "trash-button link-action-edit";
          edit.innerHTML = ICONS.penClip;
          edit.addEventListener("click", () => {
            openLinkDialog(index);
          });

          const url = document.createElement("span");
          url.className = "link-url-text";
          url.textContent = link.url;

          actions.append(remove, edit, url);
          content.append(actions);

          const title = document.createElement("div");
          title.className = "link-title-display";
          const titleIcon = document.createElement("span");
          titleIcon.innerHTML = ICONS.linkOut;
          const titleText = document.createElement("span");
          titleText.textContent = link.title || link.url;
          title.append(titleIcon, titleText);

          row.append(title, content);
          container.appendChild(row);
        });
        requestModalResize();
      }

      function renderFullEditLinks(links) {
        fullEditLinkState = normalizeLinkState(links);
        linksPanel.classList.toggle("active", fullEditLinkState.length > 0);
        renderLinkRows(fullEditLinks, fullEditLinkState, linksTitle, renderFullEditLinks);
      }

      function renderManageLinks(links) {
        manageLinkState = normalizeLinkState(links);
        renderLinkRows(manageLinks, manageLinkState, manageLinksTitle, renderManageLinks);
      }

      function renderAllNotes(message = {}) {
        if (message.loading) {
          allNotesFilters.innerHTML = '<button type="button" class="all-notes-tab selected">همه (۰)</button>';
          allNotesList.innerHTML = '<div class="all-notes-empty">در حال بارگذاری یادداشت‌ها...</div>';
          return;
        }

        if (message.error) {
          allNotesFilters.innerHTML = '<button type="button" class="all-notes-tab selected">همه (۰)</button>';
          allNotesList.innerHTML = `<div class="all-notes-empty">${escapeHtml(message.error)}</div>`;
          return;
        }

        const categoryCounts = allNotesState.reduce((counts, note) => {
          const key = note.category || "technical";
          counts[key] = (counts[key] || 0) + 1;
          return counts;
        }, {});

        const filters = [
          { key: "all", label: "همه", count: allNotesState.length },
          ...CATEGORY_PICKER_ORDER
            .filter((key) => categoryCounts[key])
            .map((key) => ({
              key,
              label: allNotesState.find((note) => note.category === key)?.categoryLabel || findCategory(key).label,
              count: categoryCounts[key]
            }))
        ];

        if (allNotesFilter !== "all" && !categoryCounts[allNotesFilter]) allNotesFilter = "all";

        allNotesFilters.innerHTML = "";
        filters.forEach((filter) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = `all-notes-tab${allNotesFilter === filter.key ? " selected" : ""}`;
          button.textContent = `${filter.label} (${toPersianNumber(filter.count)})`;
          button.addEventListener("click", () => {
            allNotesFilter = filter.key;
            renderAllNotes();
          });
          allNotesFilters.appendChild(button);
        });

        const query = allNotesSearch.value.trim().toLowerCase();
        const notes = allNotesState.filter((note) => {
          const text = `${note.title} ${note.authorName} ${note.pageName} ${note.categoryLabel}`.toLowerCase();
          const matchesSearch = !query || text.includes(query);
          const matchesFilter = allNotesFilter === "all" || note.category === allNotesFilter;
          return matchesSearch && matchesFilter;
        });

        allNotesList.innerHTML = "";

        if (notes.length === 0) {
          const empty = document.createElement("div");
          empty.className = "all-notes-empty";
          empty.textContent = "یادداشتی پیدا نشد.";
          allNotesList.appendChild(empty);
          return;
        }

        notes.forEach((note) => {
          const row = document.createElement("button");
          row.type = "button";
          row.className = "all-note-row";
          const chipBg = note.categoryBg || categoryTheme(note.category).bg;
          const chipColor = note.categoryStatus || categoryTheme(note.category).status;
          row.innerHTML = `
            <div class="all-note-content">
              <div class="all-note-text">
                <div class="all-note-title">${escapeHtml(note.title)}</div>
                <div class="all-note-meta">
                  <span>${escapeHtml(note.authorName)}</span>
                  <span class="all-note-meta-dot"></span>
                  <span>${escapeHtml(note.pageName)}</span>
                  <span class="all-note-meta-dot"></span>
                  <span>${escapeHtml(note.updatedLabel)}</span>
                </div>
              </div>
            </div>
            <span class="all-note-chip" style="background:${chipBg};color:${chipColor};">${escapeHtml(note.categoryLabel)}</span>
          `;
          row.addEventListener("click", () => {
            parent.postMessage({ pluginMessage: { type: "selectNote", payload: { nodeId: note.id } } }, "*");
          });
          allNotesList.appendChild(row);
        });
      }

      function readLinks(container) {
        const source = container === fullEditLinks ? fullEditLinkState : manageLinkState;
        return source.filter((link) => link.title || link.url);
      }

      function readFullEditPayload() {
        return {
          title: fullEditTitle.value,
          body: fullEditBody.value,
          category: selectedCategory,
          authorId: selectedAuthorId,
          links: readLinks(fullEditLinks)
        };
      }

      function emitLiveUpdate() {
        if (currentMode !== "fullEdit") return;
        parent.postMessage({ pluginMessage: { type: "liveUpdate", payload: readFullEditPayload() } }, "*");
      }

      function openLinkDialog(index = null) {
        closePickers();
        editingLinkIndex = index;
        const link = index === null ? { title: "", url: "" } : fullEditLinkState[index] || { title: "", url: "" };
        linkDialogTitle.textContent = index === null ? "افزودن لینک" : "ویرایش لینک";
        linkDialogSave.textContent = index === null ? "افزودن لینک" : "ذخیره لینک";
        linkDialogTitleInput.value = link.title || "";
        linkDialogUrlInput.value = link.url || "";
        linkDialogUrlInput.classList.toggle("url-filled", Boolean(link.url));
        linkModalLayer.classList.add("active");
        requestModalResize();
        linkDialogTitleInput.focus();
      }

      function closeLinkDialog() {
        linkModalLayer.classList.remove("active");
        editingLinkIndex = null;
      }

      function setActiveListFormat(format) {
        activeListFormat = format;
        bulletListButton.classList.toggle("active", format === "bullet");
        numberListButton.classList.toggle("active", format === "number");
      }

      function selectedLineRange(editor) {
        const value = editor.value;
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        const lineStart = value.lastIndexOf("\n", Math.max(0, start - 1)) + 1;
        const nextBreak = value.indexOf("\n", end);
        return {
          start: lineStart,
          end: nextBreak === -1 ? value.length : nextBreak
        };
      }

      function applyEditorFormat(editor, format) {
        const value = editor.value;
        const range = selectedLineRange(editor);
        const before = value.slice(0, range.start);
        const selected = value.slice(range.start, range.end);
        const after = value.slice(range.end);
        const lines = selected.split("\n");
        const next = lines
          .map((line, index) => {
            if (format === "bullet") return line.replace(/^(\s*)(?:[-•]\s+|\d+\.\s+)?/, "$1• ");
            if (format === "number") return line.replace(/^(\s*)(?:[-•]\s+|\d+\.\s+)?/, `$1${index + 1}. `);
            return line;
          })
          .join("\n");
        editor.value = before + next + after;
        editor.focus();
        editor.selectionStart = range.start;
        editor.selectionEnd = range.start + next.length;
      }

      function currentLine(editor) {
        const value = editor.value;
        const cursor = editor.selectionStart;
        const start = value.lastIndexOf("\n", Math.max(0, cursor - 1)) + 1;
        const end = value.indexOf("\n", cursor);
        return {
          start,
          end: end === -1 ? value.length : end,
          text: value.slice(start, end),
          beforeCursor: value.slice(start, cursor)
        };
      }

      function replaceRange(editor, start, end, text) {
        editor.value = editor.value.slice(0, start) + text + editor.value.slice(end);
        const cursor = start + text.length;
        editor.selectionStart = cursor;
        editor.selectionEnd = cursor;
      }

      function continueActiveList(editor, event) {
        if (event.key !== "Enter" || event.shiftKey || editor.selectionStart !== editor.selectionEnd) return;
        const line = currentLine(editor);
        const emptyListLine = line.text.match(/^(\s*)(?:[-•]|\d+\.)\s*$/);
        if (emptyListLine) {
          event.preventDefault();
          replaceRange(editor, line.start, line.end, "");
          setActiveListFormat(null);
          emitLiveUpdate();
          return;
        }

        const numberedLine = line.beforeCursor.match(/^(\s*)(\d+)\.\s+(.*)$/);
        const bulletLine = line.beforeCursor.match(/^(\s*)[-•]\s+(.*)$/);
        const format = numberedLine ? "number" : bulletLine ? "bullet" : activeListFormat;
        if (!format) return;

        event.preventDefault();
        const indent = numberedLine ? numberedLine[1] : bulletLine ? bulletLine[1] : "";
        const prefix = format === "number" ? `${indent}${numberedLine ? Number(numberedLine[2]) + 1 : 1}. ` : `${indent}• `;
        replaceRange(editor, editor.selectionStart, editor.selectionEnd, `\n${prefix}`);
        setActiveListFormat(format);
        emitLiveUpdate();
      }

      authorButton.addEventListener("click", (event) => {
        event.stopPropagation();
        togglePicker("author");
      });

      categoryButton.addEventListener("click", (event) => {
        event.stopPropagation();
        togglePicker("category");
      });

      linkToggleButton.addEventListener("click", () => {
        openLinkDialog();
      });

      addFullEditLink.addEventListener("click", () => {
        openLinkDialog();
      });

      addManageLink.addEventListener("click", () => {
        manageLinkState.push({ id: `new-${Date.now()}-${manageLinkState.length}`, title: "", url: "" });
        renderManageLinks(manageLinkState);
      });

      document.querySelectorAll("[data-full-format]").forEach((button) => {
        button.addEventListener("click", () => {
          closePickers();
          const format = button.dataset.fullFormat;
          setActiveListFormat(format);
          applyEditorFormat(fullEditBody, format);
          emitLiveUpdate();
        });
      });

      fullEditTitle.addEventListener("input", emitLiveUpdate);
      fullEditBody.addEventListener("input", emitLiveUpdate);

      fullEditBody.addEventListener("keydown", (event) => {
        continueActiveList(fullEditBody, event);
      });

      fullEditForm.addEventListener("click", (event) => {
        if (!event.target.closest(".picker-strip") && !event.target.closest("#authorButton") && !event.target.closest("#categoryButton")) {
          closePickers();
        }
      });

      linkDialogUrlInput.addEventListener("input", () => {
        linkDialogUrlInput.classList.toggle("url-filled", Boolean(linkDialogUrlInput.value.trim()));
      });

      [linkDialogTitleInput, linkDialogUrlInput].forEach((input) => {
        input.addEventListener("keydown", (event) => {
          if (event.key !== "Enter") return;
          event.preventDefault();
          event.stopPropagation();
          linkDialogSave.click();
        });
      });

      linkDialogSave.addEventListener("click", () => {
        const nextLink = {
          id: editingLinkIndex === null ? `new-${Date.now()}-${fullEditLinkState.length}` : fullEditLinkState[editingLinkIndex].id,
          title: linkDialogTitleInput.value.trim(),
          url: linkDialogUrlInput.value.trim()
        };
        if (!nextLink.title && !nextLink.url) {
          closeLinkDialog();
          return;
        }
        if (editingLinkIndex === null) fullEditLinkState.push(nextLink);
        else fullEditLinkState[editingLinkIndex] = nextLink;
        closeLinkDialog();
        renderFullEditLinks(fullEditLinkState);
        emitLiveUpdate();
      });

      linkDialogCancel.addEventListener("click", closeLinkDialog);

      linkModalLayer.addEventListener("click", (event) => {
        if (event.target === linkModalLayer) closeLinkDialog();
      });

      fullEditForm.addEventListener("submit", (event) => {
        event.preventDefault();
        emitLiveUpdate();
      });

      linkForm.addEventListener("submit", (event) => {
        event.preventDefault();
        parent.postMessage({ pluginMessage: { type: "saveLinks", payload: { links: readLinks(manageLinks) } } }, "*");
      });

      allNotesSearch.addEventListener("input", renderAllNotes);

      onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;

        if (message.mode === "category") {
          categoriesState = message.categories || [];
          selectedCategory = message.selectedCategory;
          show("category");
          renderCategoryChoices(categoryList, selectedCategory, false);
          return;
        }

        if (message.mode === "author") {
          authorsState = message.authors || [];
          selectedAuthorId = message.selectedAuthorId;
          show("author");
          renderAuthorChoices(authorList, selectedAuthorId, false);
          return;
        }

        if (message.mode === "fullEdit") {
          categoriesState = message.categories || [];
          authorsState = message.authors || [];
          selectedCategory = message.category || "technical";
          selectedAuthorId = message.authorId || "";
          fullEditTitle.value = message.title || "";
          fullEditBody.value = message.body || "";
          renderToolbar();
          renderCategoryChoices(categoryPicker, selectedCategory, true);
          renderAuthorChoices(authorPicker, selectedAuthorId, true);
          renderFullEditLinks(message.links || []);
          setActiveListFormat(null);
          closePickers();
          show("fullEdit");
          if (message.openLinkDialog) requestAnimationFrame(() => openLinkDialog());
          return;
        }

        if (message.mode === "allNotes") {
          allNotesState = message.notes || [];
          allNotesFilter = "all";
          allNotesSearch.value = "";
          renderAllNotes(message);
          show("allNotes");
          return;
        }

        show("link");
        renderManageLinks(message.links || []);
      };
    </script>
  </body>
</html>
