<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f4f5f7;
        color: #111827;
        font-family: "IRANSansXVF", "IRANSans", Tahoma, Arial, sans-serif;
        font-size: 13px;
        line-height: 1.45;
        direction: rtl;
        text-align: right;
        overflow: hidden;
      }

      .panel {
        display: none;
      }

      .panel.active {
        display: flex;
      }

      form {
        flex-direction: column;
        gap: 14px;
        padding: 16px;
        overflow: hidden;
      }

      h1 {
        margin: 0;
        font-size: 16px;
      }

      .hint {
        margin: 2px 0 0;
        color: #6b7280;
        font-size: 12px;
        font-weight: 500;
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-weight: 600;
        color: #374151;
        text-align: right;
      }

      input {
        width: 100%;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #fff;
        color: #111827;
        font: inherit;
        font-weight: 500;
        outline: none;
        padding: 9px 10px;
        text-align: right;
      }

      select {
        width: 100%;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #fff;
        color: #111827;
        font: inherit;
        font-weight: 500;
        outline: none;
        padding: 9px 10px;
        text-align: right;
      }

      textarea {
        width: 100%;
        min-height: 300px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        background: #fff;
        color: #111827;
        font-family: "IRANSansXVF", "IRANSans", Tahoma, Arial, sans-serif;
        font-size: 14px;
        font-weight: 500;
        line-height: 1.7;
        outline: none;
        padding: 10px 12px;
        resize: none;
        overflow: hidden;
        direction: rtl;
        text-align: right;
      }

      #fullEditBody {
        min-height: 170px;
      }

      input:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
      }

      select:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
      }

      textarea:focus {
        border-color: #6366f1;
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.18);
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-start;
        gap: 6px;
      }

      .tool {
        border: 1px solid #d1d5db;
        background: #fff;
        color: #111827;
        padding: 6px 10px;
      }

      .tool:hover {
        background: #eef2ff;
        border-color: #a5b4fc;
      }

      .link-editor {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .field-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }

      .link-editor-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .link-editor-title {
        font-weight: 600;
        color: #374151;
      }

      .link-list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .link-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr) auto;
        gap: 8px;
        align-items: center;
        padding: 8px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        background: #fff;
      }

      .link-remove {
        min-width: 34px;
        height: 34px;
        padding: 0;
        border-radius: 8px;
        background: #f3f4f6;
        color: #4b5563;
      }

      .link-remove:hover {
        background: #fee2e2;
        color: #991b1b;
      }

      .empty-links {
        padding: 10px 12px;
        border: 1px dashed #d1d5db;
        border-radius: 10px;
        color: #6b7280;
        background: #fff;
        text-align: right;
      }


      .actions {
        display: flex;
        direction: ltr;
        justify-content: flex-start;
        gap: 8px;
        margin-top: 4px;
      }

      button {
        border: 0;
        border-radius: 8px;
        font: inherit;
        font-weight: 600;
        padding: 9px 14px;
        cursor: pointer;
      }

      .secondary {
        background: #e5e7eb;
        color: #111827;
      }

      .primary {
        background: #4f46e5;
        color: #fff;
      }

      .small-action {
        padding: 7px 10px;
        border: 1px solid #d1d5db;
        background: #fff;
        color: #111827;
      }

      .category-panel {
        flex-direction: column;
        background: #fff;
      }

      .category-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 14px;
        background: #27272a;
        color: #fff;
        font-weight: 700;
      }

      .close {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        background: transparent;
        color: #fff;
        font-size: 20px;
        line-height: 1;
        padding: 0;
      }

      .category-list {
        display: flex;
        flex-direction: column;
        border-top: 1px solid #e5e7eb;
      }

      .category-row {
        display: flex;
        align-items: center;
        gap: 12px;
        min-height: 44px;
        padding: 0 16px;
        border: 0;
        border-bottom: 1px solid #e5e7eb;
        border-radius: 0;
        background: #fff;
        color: #1f2937;
        text-align: right;
        font-weight: 500;
      }

      .category-row:hover,
      .category-row.selected {
        background: #f3f4f6;
      }

      .dot {
        width: 10px;
        height: 10px;
        flex: 0 0 auto;
        border-radius: 999px;
      }

      .author-avatar {
        width: 20px;
        height: 20px;
        flex: 0 0 auto;
        border-radius: 999px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <form id="linkForm" class="panel">
      <div class="link-editor">
        <div class="link-editor-header">
          <span class="link-editor-title">لینک‌ها</span>
          <button type="button" class="small-action" id="addManageLink">افزودن لینک</button>
        </div>
        <div id="manageLinks" class="link-list"></div>
      </div>

      <div class="actions">
        <button type="submit" class="primary">ذخیره لینک‌ها</button>
        <button type="button" class="secondary" data-cancel>انصراف</button>
      </div>
    </form>

    <section id="categoryPanel" class="panel category-panel">
      <div id="categoryList" class="category-list"></div>
    </section>

    <section id="authorPanel" class="panel category-panel">
      <div id="authorList" class="category-list"></div>
    </section>

    <form id="fullEditForm" class="panel">
      <div class="field-row">
        <label>
          نوع
          <select id="fullEditCategory"></select>
        </label>

        <label>
          نویسنده
          <select id="fullEditAuthor"></select>
        </label>
      </div>

      <label>
        عنوان
        <input id="fullEditTitle" type="text" placeholder="عنوان یادداشت" dir="rtl" />
      </label>

      <label>
        متن
        <textarea id="fullEditBody" placeholder="متن یادداشت"></textarea>
      </label>

      <div class="toolbar">
        <button type="button" class="tool" data-full-format="bullet">بولت</button>
        <button type="button" class="tool" data-full-format="number">شماره‌گذاری</button>
      </div>

      <div class="link-editor">
        <div class="link-editor-header">
          <span class="link-editor-title">لینک‌ها</span>
          <button type="button" class="small-action" id="addFullEditLink">افزودن لینک</button>
        </div>
        <div id="fullEditLinks" class="link-list"></div>
      </div>

      <div class="actions">
        <button type="submit" class="primary">ذخیره یادداشت</button>
        <button type="button" class="secondary" data-cancel>انصراف</button>
      </div>
    </form>

    <script>
      const linkForm = document.getElementById("linkForm");
      const categoryPanel = document.getElementById("categoryPanel");
      const authorPanel = document.getElementById("authorPanel");
      const fullEditForm = document.getElementById("fullEditForm");
      const categoryList = document.getElementById("categoryList");
      const authorList = document.getElementById("authorList");
      const manageLinks = document.getElementById("manageLinks");
      const addManageLink = document.getElementById("addManageLink");
      const fullEditTitle = document.getElementById("fullEditTitle");
      const fullEditBody = document.getElementById("fullEditBody");
      const fullEditCategory = document.getElementById("fullEditCategory");
      const fullEditAuthor = document.getElementById("fullEditAuthor");
      const fullEditLinks = document.getElementById("fullEditLinks");
      const addFullEditLink = document.getElementById("addFullEditLink");
      let manageLinkState = [];
      let fullEditLinkState = [];
      let currentMode = "link";

      const MODAL_WIDTHS = {
        link: 520,
        category: 320,
        author: 320,
        fullEdit: 560
      };

      const MODAL_MIN_HEIGHTS = {
        link: 174,
        category: 120,
        author: 120,
        fullEdit: 360
      };

      function show(mode) {
        currentMode = mode;
        linkForm.classList.toggle("active", mode === "link");
        categoryPanel.classList.toggle("active", mode === "category");
        authorPanel.classList.toggle("active", mode === "author");
        fullEditForm.classList.toggle("active", mode === "fullEdit");
        requestModalResize();
      }

      function requestModalResize() {
        requestAnimationFrame(() => {
          const activePanel = document.querySelector(".panel.active");
          if (!activePanel) return;

          const rect = activePanel.getBoundingClientRect();
          const minHeight = MODAL_MIN_HEIGHTS[currentMode] || 160;
          const height = Math.max(minHeight, Math.ceil(rect.height));
          parent.postMessage(
            {
              pluginMessage: {
                type: "resize",
                payload: {
                  width: MODAL_WIDTHS[currentMode] || 520,
                  height
                }
              }
            },
            "*"
          );
        });
      }

      function growTextarea(textarea) {
        textarea.style.height = "auto";
        textarea.style.height = `${textarea.scrollHeight + 2}px`;
      }

      function growTextareas() {
        [fullEditBody].forEach((textarea) => {
          if (!textarea) return;
          growTextarea(textarea);
        });
        requestModalResize();
      }

      document.querySelectorAll("[data-cancel]").forEach((button) => {
        button.addEventListener("click", () => {
          parent.postMessage({ pluginMessage: { type: "cancel" } }, "*");
        });
      });

      linkForm.addEventListener("submit", (event) => {
        event.preventDefault();
        parent.postMessage(
          {
            pluginMessage: {
              type: "saveLinks",
              payload: { links: readManageLinks() }
            }
          },
          "*"
        );
      });

      fullEditForm.addEventListener("submit", (event) => {
        event.preventDefault();
        parent.postMessage(
          {
            pluginMessage: {
              type: "saveNote",
              payload: {
                title: fullEditTitle.value,
                body: fullEditBody.value,
                category: fullEditCategory.value,
                authorId: fullEditAuthor.value,
                links: readFullEditLinks()
              }
            }
          },
          "*"
        );
      });

      addManageLink.addEventListener("click", () => {
        manageLinkState.push({
          id: `new-${Date.now()}-${manageLinkState.length}`,
          title: "",
          url: ""
        });
        renderManageLinks(manageLinkState);
      });

      addFullEditLink.addEventListener("click", () => {
        fullEditLinkState.push({
          id: `new-${Date.now()}-${fullEditLinkState.length}`,
          title: "",
          url: ""
        });
        renderFullEditLinks(fullEditLinkState);
      });

      fullEditBody.addEventListener("keydown", (event) => {
        if (event.key === "Tab") {
          event.preventDefault();
          replaceSelection(fullEditBody, "  ");
          return;
        }

        if (event.key === "Enter") {
          continueList(fullEditBody, event);
        }
      });
      fullEditBody.addEventListener("input", growTextareas);

      document.querySelectorAll("[data-full-format]").forEach((button) => {
        button.addEventListener("click", () => {
          applyEditorFormat(fullEditBody, button.dataset.fullFormat);
        });
      });

      function replaceSelection(editor, text) {
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        editor.value = editor.value.slice(0, start) + text + editor.value.slice(end);
        editor.focus();
        editor.selectionStart = editor.selectionEnd = start + text.length;
        growTextareas();
      }

      function replaceRange(editor, start, end, text) {
        editor.value = editor.value.slice(0, start) + text + editor.value.slice(end);
        editor.focus();
        editor.selectionStart = editor.selectionEnd = start + text.length;
        growTextareas();
      }

      function wrapSelection(editor, beforeText, afterText) {
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        const selected = editor.value.slice(start, end) || "متن";
        editor.value = editor.value.slice(0, start) + beforeText + selected + afterText + editor.value.slice(end);
        editor.focus();
        editor.selectionStart = start + beforeText.length;
        editor.selectionEnd = start + beforeText.length + selected.length;
        growTextareas();
      }

      function selectedLineRange(editor) {
        const value = editor.value;
        const start = editor.selectionStart;
        const end = editor.selectionEnd;
        const lineStart = value.lastIndexOf("\n", Math.max(0, start - 1)) + 1;
        const nextBreak = value.indexOf("\n", end);
        return {
          start: lineStart,
          end: nextBreak === -1 ? value.length : nextBreak
        };
      }

      function currentLine(editor) {
        const value = editor.value;
        const cursor = editor.selectionStart;
        const start = value.lastIndexOf("\n", Math.max(0, cursor - 1)) + 1;
        const end = value.indexOf("\n", cursor);
        return {
          start,
          end: end === -1 ? value.length : end,
          text: value.slice(start, end)
        };
      }

      function continueList(editor, event) {
        const line = currentLine(editor);
        const beforeCursor = editor.value.slice(line.start, editor.selectionStart);
        const bullet = beforeCursor.match(/^(\s*)([-•])\s+(.*)$/);
        const numbered = beforeCursor.match(/^(\s*)(\d+)\.\s+(.*)$/);

        if (!bullet && !numbered) return;

        event.preventDefault();

        if (bullet) {
          if (!bullet[3].trim()) {
            replaceRange(editor, line.start, editor.selectionStart, "");
            return;
          }
          replaceSelection(editor, `\n${bullet[1]}• `);
          return;
        }

        if (numbered) {
          if (!numbered[3].trim()) {
            replaceRange(editor, line.start, editor.selectionStart, "");
            return;
          }
          replaceSelection(editor, `\n${numbered[1]}${Number(numbered[2]) + 1}. `);
        }
      }

      function applyEditorFormat(editor, format) {
        const value = editor.value;
        const range = selectedLineRange(editor);
        const before = value.slice(0, range.start);
        const selected = value.slice(range.start, range.end);
        const after = value.slice(range.end);
        const lines = selected.split("\n");

        const nextLines = lines.map((line, index) => {
          if (format === "bullet") return line.replace(/^(\s*)(?:[-•]\s+|\d+\.\s+)?/, "$1• ");
          if (format === "number") return line.replace(/^(\s*)(?:[-•]\s+|\d+\.\s+)?/, `$1${index + 1}. `);
          return line;
        });

        const next = nextLines.join("\n");
        editor.value = before + next + after;
        editor.focus();
        editor.selectionStart = range.start;
        editor.selectionEnd = range.start + next.length;
        growTextareas();
      }

      function renderCategories(categories, selectedCategory) {
        categoryList.innerHTML = "";
        categories.forEach((category) => {
          const row = document.createElement("button");
          row.type = "button";
          row.className = "category-row";
          if (category.key === selectedCategory) row.classList.add("selected");

          const dot = document.createElement("span");
          dot.className = "dot";
          dot.style.background = category.color;

          const label = document.createElement("span");
          label.textContent = category.label;

          row.append(dot, label);
          row.addEventListener("click", () => {
            parent.postMessage(
              {
                pluginMessage: {
                  type: "saveCategory",
                  payload: { category: category.key }
                }
              },
              "*"
            );
          });

          categoryList.appendChild(row);
        });
        requestModalResize();
      }

      function renderAuthors(authors, selectedAuthorId) {
        authorList.innerHTML = "";
        authors.forEach((author) => {
          const row = document.createElement("button");
          row.type = "button";
          row.className = "category-row";
          if (author.id === selectedAuthorId) row.classList.add("selected");

          const avatar = author.avatarSrc ? document.createElement("img") : document.createElement("span");
          avatar.className = author.avatarSrc ? "author-avatar" : "dot";
          if (author.avatarSrc) {
            avatar.src = author.avatarSrc;
            avatar.alt = "";
          } else {
            avatar.style.background = author.avatarFill || "#e5e7eb";
          }

          const label = document.createElement("span");
          label.textContent = author.name;

          row.append(avatar, label);
          row.addEventListener("click", () => {
            parent.postMessage(
              {
                pluginMessage: {
                  type: "saveAuthor",
                  payload: { authorId: author.id }
                }
              },
              "*"
            );
          });

          authorList.appendChild(row);
        });
        requestModalResize();
      }

      function renderFullEditCategories(categories, selectedCategory) {
        fullEditCategory.innerHTML = "";
        categories.forEach((category) => {
          const option = document.createElement("option");
          option.value = category.key;
          option.textContent = category.label;
          option.selected = category.key === selectedCategory;
          fullEditCategory.appendChild(option);
        });
      }

      function renderFullEditAuthors(authors, selectedAuthorId) {
        fullEditAuthor.innerHTML = "";
        authors.forEach((author) => {
          const option = document.createElement("option");
          option.value = author.id;
          option.textContent = author.name;
          option.selected = author.id === selectedAuthorId;
          fullEditAuthor.appendChild(option);
        });
      }

      function readManageLinks() {
        return Array.from(manageLinks.querySelectorAll(".link-row"))
          .map((row) => ({
            id: row.dataset.linkId || "",
            title: row.querySelector("[data-link-title]").value.trim(),
            url: row.querySelector("[data-link-url]").value.trim()
          }))
          .filter((link) => link.title || link.url);
      }

      function renderManageLinks(links) {
        manageLinkState = links.map((link, index) => ({
          id: link.id || `new-${Date.now()}-${index}`,
          title: link.title || "",
          url: link.url || ""
        }));
        manageLinks.innerHTML = "";

        if (manageLinkState.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty-links";
          empty.textContent = "هنوز لینکی اضافه نشده است.";
          manageLinks.appendChild(empty);
          requestModalResize();
          return;
        }

        manageLinkState.forEach((link, index) => {
          const row = document.createElement("div");
          row.className = "link-row";
          row.dataset.linkId = link.id;

          const titleInput = document.createElement("input");
          titleInput.type = "text";
          titleInput.placeholder = "عنوان لینک";
          titleInput.value = link.title;
          titleInput.dataset.linkTitle = "true";
          titleInput.addEventListener("input", () => {
            manageLinkState[index].title = titleInput.value;
          });

          const urlInput = document.createElement("input");
          urlInput.type = "text";
          urlInput.placeholder = "نشانی لینک";
          urlInput.dir = "ltr";
          urlInput.style.textAlign = "left";
          urlInput.value = link.url;
          urlInput.dataset.linkUrl = "true";
          urlInput.addEventListener("input", () => {
            manageLinkState[index].url = urlInput.value;
          });

          const removeButton = document.createElement("button");
          removeButton.type = "button";
          removeButton.className = "link-remove";
          removeButton.textContent = "×";
          removeButton.addEventListener("click", () => {
            manageLinkState.splice(index, 1);
            renderManageLinks(manageLinkState);
          });

          row.append(titleInput, urlInput, removeButton);
          manageLinks.appendChild(row);
        });
        requestModalResize();
      }

      function readFullEditLinks() {
        return Array.from(fullEditLinks.querySelectorAll(".link-row"))
          .map((row) => ({
            id: row.dataset.linkId || "",
            title: row.querySelector("[data-link-title]").value.trim(),
            url: row.querySelector("[data-link-url]").value.trim()
          }))
          .filter((link) => link.title || link.url);
      }

      function renderFullEditLinks(links) {
        fullEditLinkState = links.map((link, index) => ({
          id: link.id || `new-${Date.now()}-${index}`,
          title: link.title || "",
          url: link.url || ""
        }));
        fullEditLinks.innerHTML = "";

        if (fullEditLinkState.length === 0) {
          const empty = document.createElement("div");
          empty.className = "empty-links";
          empty.textContent = "هنوز لینکی اضافه نشده است.";
          fullEditLinks.appendChild(empty);
          requestModalResize();
          return;
        }

        fullEditLinkState.forEach((link, index) => {
          const row = document.createElement("div");
          row.className = "link-row";
          row.dataset.linkId = link.id;

          const titleInput = document.createElement("input");
          titleInput.type = "text";
          titleInput.placeholder = "عنوان لینک";
          titleInput.value = link.title;
          titleInput.dataset.linkTitle = "true";
          titleInput.addEventListener("input", () => {
            fullEditLinkState[index].title = titleInput.value;
          });

          const urlInput = document.createElement("input");
          urlInput.type = "text";
          urlInput.placeholder = "نشانی لینک";
          urlInput.dir = "ltr";
          urlInput.style.textAlign = "left";
          urlInput.value = link.url;
          urlInput.dataset.linkUrl = "true";
          urlInput.addEventListener("input", () => {
            fullEditLinkState[index].url = urlInput.value;
          });

          const removeButton = document.createElement("button");
          removeButton.type = "button";
          removeButton.className = "link-remove";
          removeButton.textContent = "×";
          removeButton.addEventListener("click", () => {
            fullEditLinkState.splice(index, 1);
            renderFullEditLinks(fullEditLinkState);
          });

          row.append(titleInput, urlInput, removeButton);
          fullEditLinks.appendChild(row);
        });
        requestModalResize();
      }

      onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;

        if (message.mode === "category") {
          show("category");
          renderCategories(message.categories || [], message.selectedCategory);
          return;
        }

        if (message.mode === "author") {
          show("author");
          renderAuthors(message.authors || [], message.selectedAuthorId);
          return;
        }

        if (message.mode === "fullEdit") {
          show("fullEdit");
          renderFullEditCategories(message.categories || [], message.category);
          renderFullEditAuthors(message.authors || [], message.authorId);
          fullEditTitle.value = message.title || "";
          fullEditBody.value = message.body || "";
          renderFullEditLinks(message.links || []);
          growTextareas();
          fullEditTitle.focus();
          return;
        }

        show("link");
        renderManageLinks(message.links || []);
      };
    </script>
  </body>
</html>
